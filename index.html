<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>四上期中考複習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--paper:#f3f6f1;--card:#fff;--ink:#1f2a24;--muted:#5b6b62;--line:#d5ded7;--plain:#8fbf6a;--hill:#d9b25a;--mount:#a8693c;--water:#2f7fb8;--accent:#c2412d;
  --f-disp:"LXGW WenKai TC","Kaiti TC","BiauKai",serif;--f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#141a17;--card:#1d2420;--ink:#e7eee9;--muted:#9fb0a6;--line:#2f3a34;--water:#5aa6dd;--accent:#ef7a63;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);line-height:1.7}
.wrap{max-width:640px;margin:0 auto;padding:32px max(16px,env(safe-area-inset-left)) 64px;display:flex;flex-direction:column;gap:22px}
.contour{height:10px;border-radius:2px;background:linear-gradient(90deg,var(--plain) 0 30%,var(--hill) 30% 55%,var(--mount) 55% 80%,var(--water) 80%)}
h1{font-family:var(--f-disp);font-size:2.1rem;margin:0;line-height:1.3}
p{margin:0;color:var(--muted)}
a.card{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:18px 20px;color:inherit;text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--c);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
a.card h2{font-family:var(--f-disp);font-size:1.5rem;margin:0;color:var(--ink)}
a.card span{font-size:.92rem;color:var(--muted)}
footer{font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="contour" aria-hidden="true"></div>
  <h1>四年級上學期 · 期中考複習</h1>
  <p>先讀重點和「易錯」，再做下面的練習題。點一個答案，馬上就會告訴你對不對、為什麼。</p>
  <a class="card" href="science.html" style="--c:var(--plain)">
    <h2>自然</h2>
    <span>康軒版 · 期中考範圍：第一單元 地表的靜與動、第二單元 水生生物與環境</span>
    <span>100 題練習（可切換全冊）</span>
  </a>
  <a class="card" href="social.html" style="--c:var(--hill)">
    <h2>社會</h2>
    <span>康軒版 · 全冊重點整理、雙語關鍵字</span>
    <span>133 題練習</span>
  </a>
  <footer>依據康軒版四上課本整理，供家庭複習使用。</footer>
</div>
</body>
</html>
